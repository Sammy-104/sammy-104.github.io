name: Verify mobile performance fixes
on:
  push:
    branches: [audit/mobile-pagespeed-fixes-20261109]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and serve the candidate
        run: |
          npm test
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/site.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
      - name: Audit public pages with mobile emulation
        shell: bash
        run: |
          mkdir -p reports
          npx --yes lighthouse --version
          for page in about; do
            case "$page" in
              home) url="http://127.0.0.1:8080/" ;;
              about) url="http://127.0.0.1:8080/about/" ;;
              vollo) url="http://127.0.0.1:8080/projects/vollo/" ;;
            esac
            npx --yes lighthouse "$url" --form-factor=mobile --chrome-flags="--headless" --output=json --output=html --output-path="reports/$page" --quiet || true
          done
      - name: Print measurements and findings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const page of ['about']) {
            const file = 'reports/' + page + '.report.json';
            if (!fs.existsSync(file)) { console.log('AUDIT_RESULT ' + JSON.stringify({page,error:'Report missing'})); continue; }
            const r = JSON.parse(fs.readFileSync(file,'utf8'));
            const metrics = Object.fromEntries(['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','interactive'].filter(id=>r.audits[id]).map(id=>[id,{value:r.audits[id].numericValue,display:r.audits[id].displayValue}]));
            const findings = Object.entries(r.audits).filter(([id,a])=>a.score!==null && a.score < 0.9).map(([id,a])=>({id,title:a.title,score:a.score,display:a.displayValue,savings:a.details?.overallSavingsMs,items:Array.isArray(a.details?.items)?a.details.items.slice(0,5):a.details?.items}));
            console.log('LCP_DETAIL ' + JSON.stringify({page,lcp:r.audits['lcp-breakdown-insight'],discovery:r.audits['lcp-discovery-insight'],requests:r.audits['network-requests']?.details?.items?.filter(x=>/webp|styles.css/.test(x.url))}));
            console.log('AUDIT_RESULT ' + JSON.stringify({page,url:r.finalDisplayedUrl,version:r.lighthouseVersion,fetchTime:r.fetchTime,runtimeError:r.runtimeError,warnings:r.runWarnings,settings:r.configSettings,categories:Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score])),metrics,findings}));
          }
          NODE
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lighthouse-reports
          path: reports/
          retention-days: 7
